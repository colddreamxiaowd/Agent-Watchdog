name: Agent Watchdog full regression 01–33
on:
  push:
    branches: [feature/aw-v2-round1-21-24, feature/aw-v2-round2-25-28, feature/aw-v2-round3-29-32-app, feature/codex-app-hook-trust-v33, main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python --version
          git --version
      - name: Full legacy + round1 unittest suite
        run: python -m unittest discover -s examples/v04/tests -v
      - name: Check tutorial markdown and relative links
        run: python scripts/validate_round1_docs.py
      - name: Compile new modules
        run: python -m compileall -q examples/v04/watchdog
