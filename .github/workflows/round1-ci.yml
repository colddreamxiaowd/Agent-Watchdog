name: Agent Watchdog round1 regression
on:
  push:
    branches: [feature/aw-v2-round1-21-24]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python --version
          git --version
      - name: Full legacy + round1 unittest suite
        run: python -m unittest discover -s examples/v04/tests -v
      - name: Compile new modules
        run: python -m compileall -q examples/v04/watchdog
